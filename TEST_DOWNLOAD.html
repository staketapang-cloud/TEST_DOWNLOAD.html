<body>


<div class="container">


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div class="header">

    <h1>
      Google Slides → PDF Converter
    </h1>

    <p>
      1 Google Slides = 1 PDF final
    </p>

  </div>


  <!-- ======================================================
       FOLDER
       ====================================================== -->

  <div class="card">

    <label>
      Folder Google Drive
    </label>

    <input
      type="text"
      id="folderUrl"
      placeholder="Tempel URL folder Google Drive di sini"
    >


    <div class="check">

      <input
        type="checkbox"
        id="recursive"
      >

      <span>
        Scan subfolder
      </span>

    </div>


    <div class="check">

      <input
        type="checkbox"
        id="forceConvert"
      >

      <span>
        Force Convert
      </span>

    </div>


    <div class="row" style="margin-top:15px;">

      <button
        class="btn-primary"
        id="btnScan"
        onclick="scanFolder()"
      >
        SCAN FOLDER
      </button>


      <button
        class="btn-success"
        id="btnConvertSelected"
        onclick="convertSelected()"
        disabled
      >
        CONVERT TERPILIH
      </button>


      <button
        class="btn-success"
        id="btnConvertAll"
        onclick="convertAll()"
        disabled
      >
        CONVERT SEMUA
      </button>


      <button
        class="btn-secondary"
        onclick="clearHistory()"
      >
        HAPUS HISTORY
      </button>

    </div>


    <!-- ====================================================
         SUMMARY
         ==================================================== -->

    <div class="summary">

      <div class="summary-box">

        <div class="summary-title">
          DITEMUKAN
        </div>

        <div
          class="summary-value"
          id="countFound"
        >
          0
        </div>

      </div>


      <div class="summary-box">

        <div class="summary-title">
          DIPILIH
        </div>

        <div
          class="summary-value"
          id="countSelected"
        >
          0
        </div>

      </div>


      <div class="summary-box">

        <div class="summary-title">
          BERHASIL
        </div>

        <div
          class="summary-value"
          id="countSuccess"
        >
          0
        </div>

      </div>


      <div class="summary-box">

        <div class="summary-title">
          GAGAL
        </div>

        <div
          class="summary-value"
          id="countFailed"
        >
          0
        </div>

      </div>

    </div>

  </div>


  <!-- ======================================================
       FILE TABLE
       ====================================================== -->

  <div class="card">

    <div class="row">

      <button
        class="btn-secondary"
        onclick="selectAll()"
      >
        PILIH SEMUA
      </button>

        onclick="deselectAll()"

      </button>

    </div>

      <table>

              >

              NO
            </th>

            <th>
              NAMA GOOGLE SLIDES
            </th>

            <th>
              STATUS
            </th>

          </tr>

        </thead>

        <tbody
          id="fileTableBody"
        >

          <tr>

            <td
              colspan="4"
              style="text-align:center;"

              Belum ada data.

        </tbody>

    </div>

  </div>


  <!-- ======================================================
       PROGRESS
       ====================================================== -->

  <div class="card">

    <h3>
      Progress Conversion
    </h3>


    <div class="progress-box">

      <div class="progress-top">

        <span id="progressLabel">
          Siap.
        </span>

        <span id="progressPercent">
          0%
        </span>

        <div
          class="progress-fill"

<script>

/* ==========================================================
   CONFIG
   ========================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzi0Z6VaceKXwHtAGFUwrSjBYNgeeKCc1CQV5apiSUpygUuojaMPl95vUhlqwwSqzxLoA/exec';


/*
 * Harus sama dengan Apps Script.
 */
const CHUNK_SIZE = 20;


/* ==========================================================
   GLOBAL
   ========================================================== */

let files = [];

let historyIds = new Set();

let converting = false;


/* ==========================================================
   INIT
   ========================================================== */

document.addEventListener(
  'DOMContentLoaded',
  async function() {

    log(
      'SLIDE TO PDF CONVERTER siap.'
    );

    log(
      'Engine: FAST SINGLE PDF.'
    );

    log(
      '1 Google Slides = 1 PDF final.'
    );

    log(
      'Large file memakai thumbnail batch.'
    );

    await loadHistory();

  }
);


/* ==========================================================
   LOG
   ========================================================== */

function log(message) {

  const box =
    document.getElementById(
      'log'
    );


  const now =
    new Date();


  const time =
    now.toLocaleTimeString(
      'id-ID'
    );


  box.innerHTML +=
    '[' +
    time +
    '] ' +
    escapeHtml(message) +
    '<br>';


  box.scrollTop =
    box.scrollHeight;
}


/* ==========================================================
   ESCAPE HTML
   ========================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}


/* ==========================================================
   API POST
   ========================================================== */

async function apiPost(data) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(data)

      }
    );


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );
  }


  const text =
    await response.text();


  try {

    return JSON.parse(text);

  } catch (err) {

    throw new Error(
      'Response API bukan JSON.'
    );
  }
}


/* ==========================================================
   API GET
   ========================================================== */

async function apiGet(action) {

  const url =
    API_URL +
    '?action=' +
    encodeURIComponent(
      action
    );


  const response =
    await fetch(url);


  if (!response.ok) {

    throw new Error(
      'HTTP ' +
      response.status
    );
  }


  return response.json();
}


/* ==========================================================
   HISTORY
   ========================================================== */

async function loadHistory() {

  try {

    const result =
      await apiGet(
        'history'
      );


    if (
      result.success &&
      Array.isArray(
        result.history
      )
    ) {

      historyIds =
        new Set(
          result.history.map(
            function(item) {
              return item.id;
            }
          )
        );

    }


  } catch (err) {

    log(
      'History belum dapat dimuat: ' +
      err.message
    );
  }
}


/* ==========================================================
   SCAN
   ========================================================== */

async function scanFolder() {

  if (converting) {
    return;
  }


  const folderUrl =
    document
      .getElementById(
        'folderUrl'
      )
      .value
      .trim();


  if (!folderUrl) {

    alert(
      'Masukkan URL folder Google Drive.'
    );

    return;
  }


  const recursive =
    document
      .getElementById(
        'recursive'
      )
      .checked;


  setButtons(true);


  setProgress(
    0,
    'Memulai scan folder.'
  );


  log(
    'Memulai scan folder.'
  );


  try {

    const result =
      await apiPost({

        action:
          'scan_folder',

        folderUrl:
          folderUrl,

        recursive:
          recursive

      });


    if (!result.success) {

      throw new Error(
        result.error ||
        'Scan gagal.'
      );
    }


    files =
      Array.isArray(
        result.files
      )
        ? result.files
        : [];


    renderTable();


    updateSummary();


    setProgress(
      100,
      'Scan selesai.'
    );


    log(
      'Scan selesai: ' +
      files.length +
      ' Google Slides ditemukan.'
    );


  } catch (err) {

    log(
      'SCAN GAGAL: ' +
      err.message
    );


    setProgress(
      0,
      'Scan gagal.'
    );


    alert(
      'Scan gagal:\n' +
      err.message
    );

  } finally {

    setButtons(false);

  }
}


/* ==========================================================
   RENDER TABLE
   ========================================================== */

function renderTable() {

  const tbody =
    document.getElementById(
      'fileTableBody'
    );


  if (!files.length) {

    tbody.innerHTML =
      '<tr>' +
      '<td colspan="4" style="text-align:center;">' +
      'Tidak ada Google Slides.' +
      '</td>' +
      '</tr>';

    return;
  }


  tbody.innerHTML =
    files.map(
      function(file, index) {

        const converted =
          historyIds.has(
            file.id
          );


        return (

          '<tr>' +

          '<td>' +

          '<input ' +
          'type="checkbox" ' +
          'class="file-check" ' +
          'data-index="' +
          index +
          '"' +
          ' onchange="updateSummary()">' +

          '</td>' +

          '<td>' +
          (index + 1) +
          '</td>' +

          '<td>' +
          escapeHtml(
            file.name
          ) +
          '</td>' +

          '<td>' +

          (
            converted

              ? '<span class="badge badge-success">SUDAH</span>'

              : '<span class="badge badge-wait">BELUM</span>'
          ) +

          '</td>' +

          '</tr>'

        );

      }
    ).join('');

}


/* ==========================================================
   SELECT ALL
   ========================================================== */

function selectAll() {

  const checks =
    document.querySelectorAll(
      '.file-check'
    );


  checks.forEach(
    function(check) {
      check.checked = true;
    }
  );


  document.getElementById(
    'checkAll'
  ).checked = true;


  updateSummary();
}


/* ==========================================================
   DESELECT ALL
   ========================================================== */

function deselectAll() {

  const checks =
    document.querySelectorAll(
      '.file-check'
    );


  checks.forEach(
    function(check) {
      check.checked = false;
    }
  );


  document.getElementById(
    'checkAll'
  ).checked = false;


  updateSummary();
}


/* ==========================================================
   TOGGLE ALL
   ========================================================== */

function toggleAll(value) {

  const checks =
    document.querySelectorAll(
      '.file-check'
    );


  checks.forEach(
    function(check) {
      check.checked = value;
    }
  );


  updateSummary();
}


/* ==========================================================
   UPDATE SUMMARY
   ========================================================== */

function updateSummary() {

  const selected =
    getSelectedFiles();


  document.getElementById(
    'countFound'
  ).textContent =
    files.length;


  document.getElementById(
    'countSelected'
  ).textContent =
    selected.length;
}


/* ==========================================================
   GET SELECTED
   ========================================================== */

function getSelectedFiles() {

  const checks =
    document.querySelectorAll(
      '.file-check:checked'
    );


  return Array.from(
    checks
  ).map(
    function(check) {

      const index =
        Number(
          check.dataset.index
        );


      return files[index];

    }
  );
}


/* ==========================================================
   CONVERT SELECTED
   ========================================================== */

async function convertSelected() {

  const selected =
    getSelectedFiles();


  if (!selected.length) {

    alert(
      'Pilih minimal 1 Google Slides.'
    );

    return;
  }


  await startConversion(
    selected
  );
}


/* ==========================================================
   CONVERT ALL
   ========================================================== */

async function convertAll() {

  if (!files.length) {

    alert(
      'Belum ada hasil scan.'
    );

    return;
  }


  await startConversion(
    files.slice()
  );
}


/* ==========================================================
   START CONVERSION
   ========================================================== */

async function startConversion(
  selectedFiles
) {

  if (converting) {
    return;
  }


  converting = true;

  setButtons(true);


  let successCount = 0;

  let failedCount = 0;

  let skipCount = 0;


  log(
    '================================'
  );


  log(
    'Conversion dimulai. Total: ' +
    selectedFiles.length +
    ' file.'
  );


  try {

    const generated = [];


    for (
      let i = 0;
      i < selectedFiles.length;
      i++
    ) {

      const file =
        selectedFiles[i];


      log(
        'Memproses ' +
        (i + 1) +
        '/' +
        selectedFiles.length +
        ': ' +
        file.name
      );


      /*
       * HISTORY
       */

      const force =
        document
          .getElementById(
            'forceConvert'
          )
          .checked;


      if (
        historyIds.has(file.id) &&
        !force
      ) {

        log(
          'SKIP: ' +
          file.name +
          ' → sudah ada di history.'
        );


        skipCount++;

        continue;
      }


      try {

        setProgress(
          Math.round(
            (i /
              selectedFiles.length) *
            100
          ),
          'Memproses file ' +
          (i + 1) +
          '/' +
          selectedFiles.length
        );


        const pdfBytes =
          await convertOneSmart(
            file,
            force
          );


        if (
          !pdfBytes ||
          !pdfBytes.length
        ) {

          throw new Error(
            'PDF kosong.'
          );
        }


        generated.push({

          file:
            file,

          bytes:
            pdfBytes

        });


        successCount++;


        document.getElementById(
          'countSuccess'
        ).textContent =
          successCount;


        log(
          'BERHASIL: ' +
          file.name
        );


      } catch (err) {

        failedCount++;


        document.getElementById(
          'countFailed'
        ).textContent =
          failedCount;


        log(
          'GAGAL: ' +
          file.name +
          ' → ' +
          err.message
        );

      }

    }


    /*
     * DOWNLOAD
     */

    if (generated.length === 1) {

      setProgress(
        100,
        'Menyiapkan download PDF.'
      );


      downloadPDF(
        generated[0].bytes,
        makePDFName(
          generated[0].file.name
        )
      );


    } else if (
      generated.length > 1
    ) {

      setProgress(
        100,
        'Membuat ZIP.'
      );


      await downloadZIP(
        generated
      );

    }


    /*
     * MARK HISTORY
     *
     * HANYA FILE YANG BENAR-BENAR
     * BERHASIL DIBUAT PDF.
     */

    if (generated.length) {

      const historyItems =
        generated.map(
          function(item) {

            return {

              id:
                item.file.id,

              name:
                item.file.name

            };

          }
        );


      try {

        await apiPost({

          action:
            'mark_converted',

          items:
            historyItems

        });


        historyItems.forEach(
          function(item) {

            historyIds.add(
              item.id
            );

          }
        );


      } catch (err) {

        log(
          'Peringatan: history gagal disimpan → ' +
          err.message
        );
      }
    }


  } finally {

    converting = false;

    setButtons(false);


    renderTable();

    updateSummary();


    log(
      '================================'
    );


    log(
      'PROSES SELESAI → Berhasil: ' +
      successCount +
      ', Skip: ' +
      skipCount +
      ', Gagal: ' +
      failedCount
    );


    setProgress(
      100,
      'Proses selesai.'
    );

  }
}


/* ==========================================================
   SMART CONVERSION
   ========================================================== */

async function convertOneSmart(
  file,
  force
) {

  /*
   * FORCE:
   * langsung large engine.
   */

  if (force) {

    log(
      'Force Convert aktif → FAST SINGLE PDF.'
    );


    return await convertLargeAsOnePDF(
      file
    );
  }


  /*
   * NORMAL:
   * coba Google Export dulu.
   */

  let result;


  try {

    result =
      await apiPost({

        action:
          'convert_one',

        fileId:
          file.id,

        fileName:
          file.name,

        forceConvert:
          false

      });


  } catch (err) {

    /*
     * Kalau request normal gagal,
     * coba engine besar.
     */

    log(
      'Export normal gagal → mencoba FAST SINGLE PDF.'
    );


    return await convertLargeAsOnePDF(
      file
    );
  }


  if (
    result.success &&
    !result.tooLarge &&
    result.base64
  ) {

    log(
      'Engine: GOOGLE EXPORT PDF.'
    );


    return base64ToUint8Array(
      result.base64
    );
  }


  if (
    result.success &&
    result.tooLarge
  ) {

    log(
      'Google Export menolak file besar → FAST SINGLE PDF.'
    );


    return await convertLargeAsOnePDF(
      file
    );
  }


  throw new Error(
    result.error ||
    'Conversion gagal.'
  );
}


/* ==========================================================
   LARGE FILE
   ========================================================== */

async function convertLargeAsOnePDF(
  file
) {

  log(
    'Membaca struktur Google Slides...'
  );


  /*
   * PENTING:
   *
   * slideInfo hanya dipanggil SEKALI.
   */

  const info =
    await apiPost({

      action:
        'slide_info',

      fileId:
        file.id

    });


  if (!info.success) {

    throw new Error(
      info.error ||
      'Gagal membaca slide.'
    );
  }


  const pageIds =
    Array.isArray(
      info.pageIds
    )
      ? info.pageIds
      : [];


  const totalSlides =
    pageIds.length;


  if (!totalSlides) {

    throw new Error(
      'Google Slides tidak memiliki slide.'
    );
  }


  log(
    'Total slide: ' +
    totalSlides
  );


  log(
    'Engine: FAST SINGLE PDF.'
  );


  log(
    'Thumbnail: SMALL.'
  );


  log(
    'Batch internal: ' +
    CHUNK_SIZE +
    ' slide.'
  );


  /*
   * BUAT SATU PDF SAJA.
   *
   * Semua thumbnail langsung masuk
   * ke PDF yang sama.
   */

  const pdfDoc =
    await PDFLib.PDFDocument.create();


  /*
   * PROSES CHUNK
   */

  for (
    let start = 0;
    start < totalSlides;
    start += CHUNK_SIZE
  ) {

    const end =
      Math.min(
        start + CHUNK_SIZE,
        totalSlides
      );


    const chunkPageIds =
      pageIds.slice(
        start,
        end
      );


    log(
      'Mengambil thumbnail slide ' +
      (start + 1) +
      '–' +
      end +
      ' dari ' +
      totalSlides
    );


    const result =
      await apiPost({

        action:
          'convert_chunk',

        fileId:
          file.id,

        pageIds:
          chunkPageIds,

        start:
          start,

        end:
          end

      });


    if (!result.success) {

      throw new Error(
        result.error ||
        'Chunk gagal.'
      );
    }


    const images =
      Array.isArray(
        result.images
      )
        ? result.images
        : [];


    if (!images.length) {

      throw new Error(
        'Chunk tidak menghasilkan thumbnail.'
      );
    }


    /*
     * MASUKKAN LANGSUNG KE PDF FINAL.
     */

    for (
      let j = 0;
      j < images.length;
      j++
    ) {

      const imageData =
        images[j];


      const pngBytes =
        base64ToUint8Array(
          imageData.base64
        );


      const png =
        await pdfDoc.embedPng(
          pngBytes
        );


      /*
       * Ukuran PDF mengikuti
       * rasio thumbnail.
       *
       * Lebar dasar 720 point.
       */

      const maxWidth =
        720;


      const width =
        maxWidth;


      const height =
        width *
        (
          png.height /
          png.width
        );


      const page =
        pdfDoc.addPage(
          [
            width,
            height
          ]
        );


      page.drawImage(
        png,
        {
          x: 0,
          y: 0,

          width:
            width,

          height:
            height
        }
      );

    }


    /*
     * Progress keseluruhan slide.
     */

    const percent =
      Math.round(
        (end / totalSlides) *
        95
      );


    setProgress(
      percent,
      'Memproses slide ' +
      end +
      '/' +
      totalSlides
    );


    log(
      'Slide ' +
      end +
      '/' +
      totalSlides +
      ' masuk ke PDF final.'
    );
  }


  /*
   * SIMPAN PDF SEKALI.
   */

  setProgress(
    98,
    'Menyusun PDF final.'
  );


  log(
    'Menyusun SATU PDF FINAL...'
  );


  const finalBytes =
    await pdfDoc.save({

      useObjectStreams:
        true

    });


  setProgress(
    100,
    'PDF final selesai.'
  );


  log(
    'PDF final selesai: ' +
    totalSlides +
    ' halaman.'
  );


  return finalBytes;
}


/* ==========================================================
   BASE64 → UINT8ARRAY
   ========================================================== */

function base64ToUint8Array(
  base64
) {

  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return bytes;
}


/* ==========================================================
   DOWNLOAD PDF
   ========================================================== */

function downloadPDF(
  bytes,
  filename
) {

  const blob =
    new Blob(
      [bytes],
      {
        type:
          'application/pdf'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;

  a.download =
    filename;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    3000
  );


  log(
    'Download PDF: ' +
    filename
  );
}


/* ==========================================================
   MAKE PDF NAME
   ========================================================== */

function makePDFName(
  name
) {

  let clean =
    String(name || 'converted')
      .replace(
        /\.pptx?$/i,
        ''
      )
      .trim();


  if (!clean) {

    clean =
      'converted';
  }


  return (
    clean +
    '.pdf'
  );
}


/* ==========================================================
   ZIP
   ========================================================== */

async function downloadZIP(
  generated
) {

  const zip =
    new JSZip();


  for (
    let i = 0;
    i < generated.length;
    i++
  ) {

    const item =
      generated[i];


    zip.file(
      makePDFName(
        item.file.name
      ),
      item.bytes
    );
  }


  log(
    'Membuat ZIP dari ' +
    generated.length +
    ' PDF...'
  );


  const blob =
    await zip.generateAsync({

      type:
        'blob',

      compression:
        'STORE'

    });


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    'SLIDE_TO_PDF_' +
    dateFileName() +
    '.zip';


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    5000
  );


  log(
    'ZIP berhasil dibuat.'
  );
}


/* ==========================================================
   DATE FILE NAME
   ========================================================== */

function dateFileName() {

  const d =
    new Date();


  const yyyy =
    d.getFullYear();


  const mm =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const dd =
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    );


  const hh =
    String(
      d.getHours()
    ).padStart(
      2,
      '0'
    );


  const mi =
    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    );


  const ss =
    String(
      d.getSeconds()
    ).padStart(
      2,
      '0'
    );


  return (
    yyyy +
    mm +
    dd +
    '_' +
    hh +
    mi +
    ss
  );
}


/* ==========================================================
   CLEAR HISTORY
   ========================================================== */

async function clearHistory() {

  if (
    !confirm(
      'Yakin ingin menghapus history conversion?'
    )
  ) {

    return;
  }


  try {

    const result =
      await apiPost({

        action:
          'clear_history'

      });


    if (!result.success) {

      throw new Error(
        result.error ||
        'Gagal menghapus history.'
      );
    }


    historyIds =
      new Set();


    renderTable();


    log(
      'History berhasil dihapus.'
    );


  } catch (err) {

    alert(
      'Gagal menghapus history:\n' +
      err.message
    );

  }
}


/* ==========================================================
   PROGRESS
   ========================================================== */

function setProgress(
  percent,
  label
) {

  const p =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );


  document.getElementById(
    'progressFill'
  ).style.width =
    p + '%';


  document.getElementById(
    'progressPercent'
  ).textContent =
    Math.round(p) + '%';


  document.getElementById(
    'progressLabel'
  ).textContent =
    label || '';
}


/* ==========================================================
   BUTTON LOCK
   ========================================================== */

function setButtons(
  locked
) {

  document.getElementById(
    'btnScan'
  ).disabled =
    locked;


  document.getElementById(
    'btnConvertSelected'
  ).disabled =
    locked ||
    files.length === 0;


  document.getElementById(
    'btnConvertAll'
  ).disabled =
    locked ||
    files.length === 0;
}
