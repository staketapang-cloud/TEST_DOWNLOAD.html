<style>

body {

.container {

.header {

.status {

.status-ready {

}

}


.progress-box {

.progress-header {

}


.progress-track {

}

    35px;

}

@media (

@media (

      14px;
  }

  }

  }

</style>

</head>


<body>


<div class="container">


  <!-- =======================================================
       HEADER
       ======================================================= -->

  <div class="header">

    <h1>
      Google Slides → PDF Converter
    </h1>

    <p>
      Konversi cepat Google Slides menjadi PDF
    </p>

  </div>


  <!-- =======================================================
       FOLDER
       ======================================================= -->

  <div class="card">

    <label>
      URL Folder Google Drive
    </label>

    <input
      type="text"
      id="folderUrl"
      placeholder="https://drive.google.com/drive/folders/..."
    >


    <div class="options">

      <label class="check">

        <input
          type="checkbox"
          id="recursive"
          checked
        >

        Scan subfolder

      </label>


      <label class="check">

        <input
          type="checkbox"
          id="forceConvert"
        >

        Force Convert

      </label>

    </div>


    <div class="buttons">

      <button
        class="btn-primary"
        id="btnScan"
        onclick="scanFolder()"
      >
        🔍 SCAN FOLDER
      </button>


      <button
        class="btn-secondary"
        onclick="loadHistory()"
      >
        📜 HISTORY
      </button>

        onclick="clearHistory()"
      >

      </button>

  </div>


  <!-- =======================================================
       SUMMARY
       ======================================================= -->

  <div class="summary">

    <div class="summary-card">

      <div>
        Total Slides
      </div>

      <div
        class="number"
        id="summaryTotal"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div>
        Dipilih
      </div>

      <div
        class="number"
        id="summarySelected"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div>
        Berhasil
      </div>

      <div
        class="number"
        id="summarySuccess"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div>
        Gagal
      </div>

      <div
        class="number"
        id="summaryFailed"
      >
        0
      </div>

    </div>

  </div>


  <!-- =======================================================
       FILE TABLE
       ======================================================= -->

  <div class="card">

    <div
      class="buttons"
      style="margin-top:0"
    >

      <button
        class="btn-secondary"
        onclick="selectAll()"
      >
        ☑ PILIH SEMUA
      </button>


      <button
        class="btn-secondary"
        onclick="deselectAll()"
      >
        ☐ BATALKAN SEMUA
      </button>


      <button
        class="btn-success"
        id="btnSelected"
        onclick="convertSelected()"
        disabled
      >
        ⚡ CONVERT TERPILIH
      </button>


      <button
        class="btn-warning"
        id="btnAll"
        onclick="convertAll()"
        disabled
      >
        🚀 CONVERT SEMUA
      </button>

    </div>


    <div
      class="table-wrap"
      style="margin-top:15px"
    >

      <table>

        <thead>

          <tr>

            <th>
              #
            </th>

            <th>
              <input
                type="checkbox"
                id="masterCheck"
                onchange="toggleMaster(this)"
              >
            </th>

            <th>
              Nama Google Slides
            </th>

            <th>
              Folder
            </th>

            <th>
              Ukuran
            </th>

            <th>
              Status
            </th>

          </tr>

        </thead>

        <tbody id="fileTableBody">

          <tr>

            <td
              colspan="6"
              class="empty"
            >
              Belum melakukan scan folder.
            </td>

          </tr>

        </tbody>

      </table>

  </div>


  <!-- =======================================================
       PROGRESS
       ======================================================= -->

          Menunggu proses...
        </span>

        <span id="progressPercent">
          0%
        </span>

      </div>


      <div class="progress-track">

        <div
          class="progress-bar"
          id="progressBar"

  <!-- =======================================================
       LOG
       ======================================================= -->

  <div class="card">

      class="log"

<script>


/* ============================================================
   API URL
   ============================================================ */

const API_URL =
  'https://script.google.com/macros/s/AKfycbzi0Z6VaceKXwHtAGFUwrSjBYNgeeKCc1CQV5apiSUpygUuojaMPl95vUhlqwwSqzxLoA/exec';


/* ============================================================
   STATE
   ============================================================ */

let scannedFiles = [];

let conversionResults = [];

let converting = false;


/* ============================================================
   API REQUEST
   ============================================================ */

async function apiPost(payload) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:
          JSON.stringify(
            payload
          )
      }
    );


  if (!response.ok) {

    throw new Error(
      'HTTP Error ' +
      response.status
    );
  }


  const text =
    await response.text();


  let json;


  try {

    json =
      JSON.parse(
        text
      );

  } catch (err) {

    throw new Error(
      'Response API bukan JSON: ' +
      text.substring(
        0,
        300
      )
    );
  }


  if (
    !json.success &&
    !json.tooLarge
  ) {

    throw new Error(
      json.message ||
      'API gagal.'
    );
  }


  return json;
}


/* ============================================================
   LOG
   ============================================================ */

function log(message) {

  const box =
    document.getElementById(
      'log'
    );


  const time =
    new Date()
      .toLocaleTimeString(
        'id-ID'
      );


  box.textContent +=
    '[' +
    time +
    '] ' +
    message +
    '\n';


  box.scrollTop =
    box.scrollHeight;
}


/* ============================================================
   PROGRESS
   ============================================================ */

function setProgress(
  percent,
  label,
  note
) {

  percent =
    Math.max(
      0,
      Math.min(
        100,
        Number(percent) || 0
      )
    );


  document.getElementById(
    'progressBar'
  ).style.width =
    percent + '%';


  document.getElementById(
    'progressPercent'
  ).textContent =
    Math.round(percent) + '%';


  document.getElementById(
    'progressLabel'
  ).textContent =
    label || 'Memproses...';


  document.getElementById(
    'progressNote'
  ).textContent =
    note || '';
}


/* ============================================================
   SCAN
   ============================================================ */

async function scanFolder() {

  if (converting) {
    return;
  }


  const folderUrl =
    document.getElementById(
      'folderUrl'
    ).value.trim();


  if (!folderUrl) {

    alert(
      'Masukkan URL folder Google Drive.'
    );

    return;
  }


  const recursive =
    document.getElementById(
      'recursive'
    ).checked;


  const button =
    document.getElementById(
      'btnScan'
    );


  button.disabled =
    true;


  try {

    log(
      'Memulai scan folder.'
    );


    setProgress(
      5,
      'Scanning folder...',
      'Membaca Google Drive.'
    );


    const result =
      await apiPost({

        action:
          'scan',

        folderUrl:
          folderUrl,

        recursive:
          recursive
      });


    if (!result.success) {

      throw new Error(
        result.message ||
        'Scan gagal.'
      );
    }


    scannedFiles =
      Array.isArray(
        result.files
      )
        ? result.files
        : [];


    renderFiles();


    log(
      'Scan selesai: ' +
      scannedFiles.length +
      ' Google Slides ditemukan.'
    );


    setProgress(
      100,
      'Scan selesai',
      scannedFiles.length +
      ' Google Slides ditemukan.'
    );


  } catch (err) {

    console.error(err);


    log(
      'ERROR SCAN: ' +
      err.message
    );


    setProgress(
      0,
      'Scan gagal',
      err.message
    );


    alert(
      'Scan gagal:\n\n' +
      err.message
    );


  } finally {

    button.disabled =
      false;
  }
}


/* ============================================================
   RENDER FILES
   ============================================================ */

function renderFiles() {

  const body =
    document.getElementById(
      'fileTableBody'
    );


  body.innerHTML =
    '';


  if (
    scannedFiles.length === 0
  ) {

    body.innerHTML =

      '<tr>' +
      '<td colspan="6" class="empty">' +
      'Tidak ada Google Slides ditemukan.' +
      '</td>' +
      '</tr>';


    updateSummary();

    return;
  }


  scannedFiles.forEach(
    function(file, index) {

      const tr =
        document.createElement(
          'tr'
        );


      const checked =
        file.selected
          ? 'checked'
          : '';


      let statusHTML;


      if (
        file.alreadyConverted
      ) {

        statusHTML =
          '<span class="status status-done">' +
          'SUDAH DIKONVERSI' +
          '</span>';

      } else {

        statusHTML =
          '<span class="status status-new">' +
          'SIAP' +
          '</span>';
      }


      tr.innerHTML =

        '<td>' +
        (index + 1) +
        '</td>' +

        '<td>' +

        '<input ' +
        'type="checkbox" ' +
        'class="fileCheck" ' +
        'data-index="' +
        index +
        '" ' +
        checked +
        '>' +

        '</td>' +

        '<td>' +

        '<strong>' +
        escapeHtml(
          file.name
        ) +
        '</strong>' +

        '<div class="small">' +
        escapeHtml(
          file.id
        ) +
        '</div>' +

        '</td>' +

        '<td>' +

        escapeHtml(
          file.folder ||
          ''
        ) +

        '</td>' +

        '<td>' +

        formatSize(
          file.size
        ) +

        '</td>' +

        '<td>' +

        statusHTML +

        '</td>';


      body.appendChild(
        tr
      );
    }
  );


  document
    .querySelectorAll(
      '.fileCheck'
    )
    .forEach(
      function(check) {

        check.addEventListener(
          'change',
          function() {

            const index =
              Number(
                this.dataset.index
              );


            scannedFiles[index]
              .selected =
              this.checked;


            updateSummary();
          }
        );
      }
    );


  updateSummary();


  document.getElementById(
    'btnAll'
  ).disabled =
    scannedFiles.length === 0;
}


/* ============================================================
   ESCAPE HTML
   ============================================================ */

function escapeHtml(value) {

  return String(
    value == null
      ? ''
      : value
  )
  .replace(
    /&/g,
    '&amp;'
  )
  .replace(
    /</g,
    '&lt;'
  )
  .replace(
    />/g,
    '&gt;'
  )
  .replace(
    /"/g,
    '&quot;'
  )
  .replace(
    /'/g,
    '&#039;'
  );
}


/* ============================================================
   FORMAT SIZE
   ============================================================ */

function formatSize(
  bytes
) {

  bytes =
    Number(bytes) || 0;


  if (
    bytes <= 0
  ) {

    return 'Google Slides';
  }


  if (
    bytes < 1024 * 1024
  ) {

    return (
      bytes /
      1024
    ).toFixed(1) +
    ' KB';
  }


  return (
    bytes /
    1024 /
    1024
  ).toFixed(2) +
  ' MB';
}


/* ============================================================
   MASTER CHECK
   ============================================================ */

function toggleMaster(
  checkbox
) {

  scannedFiles.forEach(
    function(file) {

      file.selected =
        checkbox.checked;
    }
  );


  document
    .querySelectorAll(
      '.fileCheck'
    )
    .forEach(
      function(check) {

        check.checked =
          checkbox.checked;
      }
    );


  updateSummary();
}


/* ============================================================
   SELECT ALL
   ============================================================ */

function selectAll() {

  scannedFiles.forEach(
    function(file) {

      file.selected =
        true;
    }
  );


  document
    .querySelectorAll(
      '.fileCheck'
    )
    .forEach(
      function(check) {

        check.checked =
          true;
      }
    );


  document.getElementById(
    'masterCheck'
  ).checked =
    true;


  updateSummary();
}


/* ============================================================
   DESELECT
   ============================================================ */

function deselectAll() {

  scannedFiles.forEach(
    function(file) {

      file.selected =
        false;
    }
  );


  document
    .querySelectorAll(
      '.fileCheck'
    )
    .forEach(
      function(check) {

        check.checked =
          false;
      }
    );


  document.getElementById(
    'masterCheck'
  ).checked =
    false;


  updateSummary();
}


/* ============================================================
   SUMMARY
   ============================================================ */

function updateSummary() {

  const selected =
    scannedFiles.filter(
      function(file) {

        return file.selected;
      }
    ).length;


  document.getElementById(
    'summaryTotal'
  ).textContent =
    scannedFiles.length;


  document.getElementById(
    'summarySelected'
  ).textContent =
    selected;


  document.getElementById(
    'summarySuccess'
  ).textContent =
    conversionResults.filter(
      function(item) {

        return item.success;
      }
    ).length;


  document.getElementById(
    'summaryFailed'
  ).textContent =
    conversionResults.filter(
      function(item) {

        return !item.success &&
               !item.skipped;
      }
    ).length;


  document.getElementById(
    'btnSelected'
  ).disabled =
    selected === 0 ||
    converting;
}


/* ============================================================
   CONVERT SELECTED
   ============================================================ */

async function convertSelected() {

  if (converting) {
    return;
  }


  const files =
    scannedFiles.filter(
      function(file) {

        return file.selected;
      }
    );


  if (
    files.length === 0
  ) {

    alert(
      'Pilih minimal satu Google Slides.'
    );

    return;
  }


  await runConversion(
    files
  );
}


/* ============================================================
   CONVERT ALL
   ============================================================ */

async function convertAll() {

  if (converting) {
    return;
  }


  if (
    scannedFiles.length === 0
  ) {

    alert(
      'Belum ada hasil scan.'
    );

    return;
  }


  await runConversion(
    scannedFiles.slice()
  );
}


/* ============================================================
   MAIN CONVERSION
   ============================================================ */

async function runConversion(
  files
) {

  if (converting) {
    return;
  }


  converting =
    true;


  conversionResults =
    [];


  updateSummary();


  document.getElementById(
    'btnSelected'
  ).disabled =
    true;


  document.getElementById(
    'btnAll'
  ).disabled =
    true;


  const force =
    document.getElementById(
      'forceConvert'
    ).checked;


  const finalPDFs = [];


  log(
    '================================'
  );


  log(
    'Conversion dimulai. Total: ' +
    files.length +
    ' file.'
  );


  try {

    for (
      let i = 0;
      i < files.length;
      i++
    ) {

      const file =
        files[i];


      const overallStart =
        (
          i /
          files.length
        ) * 100;


      setProgress(

        overallStart,

        'Memproses file ' +
        (i + 1) +
        ' / ' +
        files.length,

        file.name
      );


      log(
        'Memproses ' +
        (i + 1) +
        '/' +
        files.length +
        ': ' +
        file.name
      );


      try {

        const result =
          await convertOneSmart(
            file,
            force,
            i,
            files.length
          );


        if (
          result.skipped
        ) {

          conversionResults.push({

            success: true,

            skipped: true,

            file:
              file
          });


          log(
            'SKIP: ' +
            file.name +
            ' → sudah pernah dikonversi.'
          );


          continue;
        }


        if (
          result.success &&
          result.bytes
        ) {

          finalPDFs.push({

            name:
              result.pdfName,

            bytes:
              result.bytes,

            file:
              file
          });


          conversionResults.push({

            success: true,

            skipped: false,

            file:
              file
          });


          log(
            'BERHASIL: ' +
            file.name +
            ' → ' +
            result.pdfName
          );


        } else {

          throw new Error(
            result.message ||
            'Konversi gagal.'
          );
        }


      } catch (err) {

        conversionResults.push({

          success: false,

          skipped: false,

          file:
            file,

          message:
            err.message
        });


        log(
          'GAGAL: ' +
          file.name +
          ' → ' +
          err.message
        );
      }


      updateSummary();
    }


    /*
     * DOWNLOAD
     */

    if (
      finalPDFs.length === 1
    ) {

      log(
        'Menyiapkan 1 PDF final untuk download.'
      );


      downloadBytes(

        finalPDFs[0].bytes,

        finalPDFs[0].name,

        'application/pdf'
      );


    } else if (
      finalPDFs.length > 1
    ) {

      log(
        'Menyiapkan ZIP berisi ' +
        finalPDFs.length +
        ' PDF final.'
      );


      await downloadZip(
        finalPDFs
      );
    }


    const success =
      conversionResults.filter(
        function(item) {

          return item.success &&
                 !item.skipped;
        }
      ).length;


    const skipped =
      conversionResults.filter(
        function(item) {

          return item.skipped;
        }
      ).length;


    const failed =
      conversionResults.filter(
        function(item) {

          return !item.success &&
                 !item.skipped;
        }
      ).length;


    log(
      '================================'
    );


    log(
      'PROSES SELESAI → ' +
      'Berhasil: ' +
      success +
      ', Skip: ' +
      skipped +
      ', Gagal: ' +
      failed
    );


    setProgress(

      100,

      'PROSES SELESAI',

      'Berhasil: ' +
      success +
      ' | Skip: ' +
      skipped +
      ' | Gagal: ' +
      failed
    );


  } finally {

    converting =
      false;


    updateSummary();


    document.getElementById(
      'btnAll'
    ).disabled =
      scannedFiles.length === 0;

  }
}


/* ============================================================
   SMART CONVERSION
   ============================================================ */

async function convertOneSmart(
  file,
  force,
  fileIndex,
  totalFiles
) {

  /*
   * REQUEST 1:
   * Coba Google Export normal.
   */

  const result =
    await apiPost({

      action:
        'convertOne',

      fileId:
        file.id ||
        file.fileId,

      force:
        force
    });


  /*
   * Sudah pernah dikonversi.
   */

  if (
    result.skipped
  ) {

    return {

      success: true,

      skipped: true
    };
  }


  /*
   * Export normal berhasil.
   */

  if (
    result.success &&
    result.base64
  ) {

    return {

      success: true,

      skipped: false,

      bytes:
        base64ToUint8Array(
          result.base64
        ),

      pdfName:
        result.pdfName ||
        (
          removeExtension(
            file.name
          ) +
          '.pdf'
        )
    };
  }


  /*
   * File terlalu besar.
   *
   * Masuk FAST INTERNAL ENGINE.
   */

  if (
    result.tooLarge
  ) {

    log(
      'File besar → menggunakan engine cepat Direct PNG → PDF.'
    );


    return await convertLargeAsOnePdf(
      file,
      force,
      fileIndex,
      totalFiles
    );
  }


  throw new Error(
    result.message ||
    'Konversi gagal.'
  );
}


/* ============================================================
   LARGE FILE → ONE FINAL PDF
   ============================================================ */

async function convertLargeAsOnePdf(
  file,
  force,
  fileIndex,
  totalFiles
) {

  const fileId =
    file.id ||
    file.fileId;


  /*
   * Ambil informasi jumlah slide.
   */

  const info =
    await apiPost({

      action:
        'slideInfo',

      fileId:
        fileId
    });


  if (!info.success) {

    throw new Error(
      info.message ||
      'Gagal membaca jumlah slide.'
    );
  }


  const totalSlides =
    Number(
      info.totalSlides
    );


  const chunkSize =
    Number(
      info.chunkSize
    ) || 10;


  if (
    totalSlides <= 0
  ) {

    throw new Error(
      'Google Slides tidak memiliki slide.'
    );
  }


  log(
    'Total slide: ' +
    totalSlides +
    ' | proses cepat internal.'
  );


  const chunkPDFs = [];


  let chunkNumber = 0;


  /*
   * INTERNAL CHUNK.
   *
   * User tetap mendapatkan SATU PDF.
   */

  for (
    let start = 0;
    start < totalSlides;
    start += chunkSize
  ) {

    const end =
      Math.min(
        start +
        chunkSize,
        totalSlides
      );


    chunkNumber++;


    /*
     * Progress maksimum 90%.
     * 100% baru setelah PDF final selesai.
     */

    const slideProgress =
      start /
      totalSlides;


    const overallBase =
      (
        fileIndex /
        totalFiles
      ) * 100;


    const overallFileWidth =
      100 /
      totalFiles;


    const localProgress =
      slideProgress *
      90;


    const percent =
      overallBase +
      (
        localProgress /
        100
      ) *
      overallFileWidth;


    setProgress(

      percent,

      'Memproses slide ' +
      (start + 1) +
      '–' +
      end,

      file.name +
      ' | ' +
      end +
      '/' +
      totalSlides +
      ' slide'
    );


    log(
      'Memproses slide ' +
      (start + 1) +
      '–' +
      end +
      '...'
    );


    /*
     * Request pendek.
     */

    const result =
      await apiPost({

        action:
          'convertChunk',

        fileId:
          fileId,

        startIndex:
          start,

        endIndex:
          end
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'Gagal memproses slide.'
      );
    }


    const bytes =
      base64ToUint8Array(
        result.base64
      );


    chunkPDFs.push(
      bytes
    );


    log(
      'Slide ' +
      (start + 1) +
      '–' +
      end +
      ' selesai.'
    );
  }


  /*
   * SEKARANG GABUNGKAN
   * SEMUA INTERNAL PDF
   * MENJADI SATU PDF FINAL.
   */

  setProgress(

    (
      fileIndex /
      totalFiles
    ) *
    100 +
    (
      95 /
      totalFiles
    ),

    'Menyusun PDF final',

    'Menggabungkan seluruh slide menjadi satu PDF.'
  );


  log(
    'Menyusun PDF final dari ' +
    chunkPDFs.length +
    ' proses internal...'
  );


  const finalBytes =
    await mergePDFs(
      chunkPDFs
    );


  const pdfName =
    removeExtension(
      file.name
    ) +
    '.pdf';


  /*
   * HISTORY DICATAT
   * HANYA SETELAH FINAL PDF BERHASIL.
   */

  await apiPost({

    action:
      'markConverted',

    fileId:
      fileId,

    fileName:
      file.name,

    pdfName:
      pdfName,

    method:
      'DIRECT_PNG_TO_PDF'
  });


  /*
   * Update status lokal.
   */

  file.alreadyConverted =
    true;


  log(
    'PDF FINAL selesai: ' +
    pdfName
  );


  return {

    success: true,

    skipped: false,

    bytes:
      finalBytes,

    pdfName:
      pdfName
  };
}


/* ============================================================
   MERGE PDF
   ============================================================ */

async function mergePDFs(
  pdfBytesList
) {

  if (
    !pdfBytesList ||
    pdfBytesList.length === 0
  ) {

    throw new Error(
      'Tidak ada PDF untuk digabungkan.'
    );
  }


  const mergedPdf =
    await PDFLib.PDFDocument.create();


  for (
    let i = 0;
    i < pdfBytesList.length;
    i++
  ) {

    const chunkBytes =
      pdfBytesList[i];


    const chunkPdf =
      await PDFLib.PDFDocument.load(
        chunkBytes
      );


    const pages =
      await mergedPdf.copyPages(
        chunkPdf,
        chunkPdf.getPageIndices()
      );


    pages.forEach(
      function(page) {

        mergedPdf.addPage(
          page
        );
      }
    );
  }


  const finalBytes =
    await mergedPdf.save({

      useObjectStreams:
        true,

      addDefaultPage:
        false
    });


  return new Uint8Array(
    finalBytes
  );
}


/* ============================================================
   BASE64 → UINT8ARRAY
   ============================================================ */

function base64ToUint8Array(
  base64
) {

  const binary =
    atob(
      base64
    );


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);
  }


  return bytes;
}


/* ============================================================
   DOWNLOAD BYTES
   ============================================================ */

function downloadBytes(
  bytes,
  fileName,
  mimeType
) {

  const blob =
    new Blob(
      [bytes],
      {
        type:
          mimeType
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    fileName;


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    5000
  );
}


/* ============================================================
   ZIP
   ============================================================ */

async function downloadZip(
  pdfs
) {

  const zip =
    new JSZip();


  pdfs.forEach(
    function(item) {

      zip.file(
        item.name,
        item.bytes
      );
    }
  );


  const blob =
    await zip.generateAsync({

      type:
        'blob',

      compression:
        'STORE'
    });
  
  
  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement(
      'a'
    );


  a.href =
    url;


  a.download =
    'Google_Slides_PDF_' +
    formatDateFile() +
    '.zip';


  document.body.appendChild(
    a
  );


  a.click();


  a.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    5000
  );
}


/* ============================================================
   REMOVE EXTENSION
   ============================================================ */

function removeExtension(
  name
) {

  return String(name)
    .replace(
      /\.[^.]+$/,
      ''
    );
}


/* ============================================================
   DATE FILE
   ============================================================ */

function formatDateFile() {

  const d =
    new Date();


  const yyyy =
    d.getFullYear();


  const mm =
    String(
      d.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const dd =
    String(
      d.getDate()
    ).padStart(
      2,
      '0'
    );


  const hh =
    String(
      d.getHours()
    ).padStart(
      2,
      '0'
    );


  const mi =
    String(
      d.getMinutes()
    ).padStart(
      2,
      '0'
    );


  const ss =
    String(
      d.getSeconds()
    ).padStart(
      2,
      '0'
    );


  return (
    yyyy +
    mm +
    dd +
    '_' +
    hh +
    mi +
    ss
  );
}


/* ============================================================
   HISTORY
   ============================================================ */

async function loadHistory() {

  try {

    const result =
      await apiPost({

        action:
          'history'
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'Gagal membaca history.'
      );
    }


    const history =
      result.history || [];


    if (
      history.length === 0
    ) {

      alert(
        'History masih kosong.'
      );

      return;
    }


    let text =
      'HISTORY CONVERSION\n\n';


    history
      .slice(
        0,
        30
      )
      .forEach(
        function(item, index) {

          text +=

            (index + 1) +
            '. ' +

            (item.fileName || '') +

            '\n' +

            '   PDF: ' +
            (item.pdfName || '') +

            '\n' +

            '   Waktu: ' +
            (item.convertedAt || '') +

            '\n\n';
        }
      );


    alert(
      text
    );


  } catch (err) {

    alert(
      'History gagal:\n\n' +
      err.message
    );
  }
}


/* ============================================================
   CLEAR HISTORY
   ============================================================ */

async function clearHistory() {

  if (
    !confirm(
      'Hapus seluruh history conversion?'
    )
  ) {

    return;
  }


  try {

    const result =
      await apiPost({

        action:
          'clearHistory'
      });


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        'Gagal menghapus history.'
      );
    }


    scannedFiles.forEach(
      function(file) {

        file.alreadyConverted =
          false;
      }
    );


    renderFiles();


    log(
      'History conversion berhasil dihapus.'
    );


  } catch (err) {

    alert(
      'Gagal menghapus history:\n\n' +
      err.message
    );
  }
}
